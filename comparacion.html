<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparación de dos valores</title>
  <link rel="stylesheet" href="css/comparacion.css">
</head>
<body>
  <main class="contenedor">
    <h1>5. Comparación de dos valores</h1>

    <!-- Campos de entrada -->
      <label for="v1">Primer número</label>
      <input type="number" id="v1" step="any" placeholder="Primer número">
      <label for="v2">Segundo número</label>
      <input type="number" id="v2" step="any" placeholder="Segundo número">

    <!-- Botón que ejecuta el cálculo -->
    <button id="btnCalcular">Comparar</button>

    <!-- Botón que limpia los campos y el resultado -->
    <button id="btnLimpiar" class="limpiar">Limpiar</button>

    <!-- Área donde se muestra el resultado -->
    <div id="resultado"></div>

    <a class="volver" href="index.html">← Volver al menú</a>
  </main>

  <script src="js/comparacion.js"></script>
</body>
</html>
