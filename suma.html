<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suma de tres valores</title>
  <link rel="stylesheet" href="css/suma.css">
</head>
<body>
  <main class="contenedor">
    <h1>1. Suma de tres valores</h1>

    <!-- Campos de entrada -->
      <label for="n1">Primer número</label>
      <input type="number" id="n1" step="any" placeholder="Primer número">
      <label for="n2">Segundo número</label>
      <input type="number" id="n2" step="any" placeholder="Segundo número">
      <label for="n3">Tercer número</label>
      <input type="number" id="n3" step="any" placeholder="Tercer número">

    <!-- Botón que ejecuta el cálculo -->
    <button id="btnCalcular">Calcular suma</button>

    <!-- Botón que limpia los campos y el resultado -->
    <button id="btnLimpiar" class="limpiar">Limpiar</button>

    <!-- Área donde se muestra el resultado -->
    <div id="resultado"></div>

    <a class="volver" href="index.html">← Volver al menú</a>
  </main>

  <script src="js/suma.js"></script>
</body>
</html>
