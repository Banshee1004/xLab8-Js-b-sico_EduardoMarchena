<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuadrado de un número</title>
  <link rel="stylesheet" href="css/cuadrado.css">
</head>
<body>
  <main class="contenedor">
    <h1>2. Cuadrado de un número</h1>

    <!-- Campos de entrada -->
      <label for="numero">Escriba un número</label>
      <input type="number" id="numero" step="any" placeholder="Escriba un número">

    <!-- Botón que ejecuta el cálculo -->
    <button id="btnCalcular">Calcular cuadrado</button>

    <!-- Botón que limpia los campos y el resultado -->
    <button id="btnLimpiar" class="limpiar">Limpiar</button>

    <!-- Área donde se muestra el resultado -->
    <div id="resultado"></div>

    <a class="volver" href="index.html">← Volver al menú</a>
  </main>

  <script src="js/cuadrado.js"></script>
</body>
</html>
