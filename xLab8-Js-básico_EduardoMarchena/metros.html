<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversión de metros</title>
  <link rel="stylesheet" href="css/metros.css">
</head>
<body>
  <main class="contenedor">
    <h1>4. Conversión de metros</h1>

    <!-- Campos de entrada -->
      <label for="metros">Valor en metros</label>
      <input type="number" id="metros" step="any" placeholder="Valor en metros">

    <!-- Botón que ejecuta el cálculo -->
    <button id="btnCalcular">Convertir</button>

    <!-- Botón que limpia los campos y el resultado -->
    <button id="btnLimpiar" class="limpiar">Limpiar</button>

    <!-- Área donde se muestra el resultado -->
    <div id="resultado"></div>

    <a class="volver" href="index.html">← Volver al menú</a>
  </main>

  <script src="js/metros.js"></script>
</body>
</html>
